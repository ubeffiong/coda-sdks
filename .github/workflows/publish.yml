name: publish

# Publishes the released SDKs to their registries: npm (with provenance), PyPI, NuGet, Maven
# Central and crates.io. Runs when a GitHub Release is published (release.yml), or by hand with
# dry-run to build and validate every package without uploading anything. Set-up: RELEASING.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and validate every package without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sdk-release
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}

jobs:
  verify:
    name: Versions and tests agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(node -p "require('./typescript/package.json').version")"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: bash scripts/check-versions.sh "${{ steps.version.outputs.version }}"

  npm:
    needs: verify
    runs-on: ubuntu-latest
    environment: sdk-release
    permissions:
      contents: read
      id-token: write # npm provenance
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm publish --access public --provenance ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    needs: verify
    runs-on: ubuntu-latest
    environment: sdk-release
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.2.2.post1 twine==6.1.0
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - if: env.DRY_RUN != 'true'
        run: python -m twine upload --non-interactive dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  nuget:
    needs: verify
    runs-on: ubuntu-latest
    environment: sdk-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test dotnet/Coda.Client.slnx -c Release
      - run: dotnet pack dotnet/src/Coda.Client/Coda.Client.csproj -c Release -o out
      - if: env.DRY_RUN != 'true'
        run: dotnet nuget push "out/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  maven:
    needs: verify
    runs-on: ubuntu-latest
    environment: sdk-release
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - if: env.DRY_RUN == 'true'
        run: mvn -B verify
      - if: env.DRY_RUN != 'true'
        run: mvn -B -P release deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  crates:
    needs: verify
    runs-on: ubuntu-latest
    environment: sdk-release
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cargo test --locked
      - run: cargo publish --locked ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
