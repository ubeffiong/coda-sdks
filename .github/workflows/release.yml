name: release

# Tag vX.Y.Z: build every SDK package, attach them to a GitHub Release (with SHA256SUMS), and tag
# the Go module (go/vX.Y.Z). install.sh / install.ps1 and the CODA Developer hub install from it.
# Publishing to npm, PyPI, NuGet, Maven Central and crates.io is publish.yml, after this.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.21'

      - id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          bash scripts/check-versions.sh "$v"

      - name: Test and package
        run: |
          set -euo pipefail
          mkdir -p out
          (cd typescript && npm ci && npm test && npm pack --pack-destination ../out)
          (cd python && python -m unittest discover -s tests && python -m pip install build==1.2.2.post1 && python -m build --outdir ../out)
          dotnet test dotnet/Coda.Client.slnx -c Release
          dotnet pack dotnet/src/Coda.Client/Coda.Client.csproj -c Release -o out
          (cd java && mvn -B -q package && cp target/coda-client-*.jar ../out/)
          (cd go && go vet ./... && go test ./...)
          (cd rust && cargo test --locked && cargo package --locked && cp target/package/coda-client-*.crate ../out/)
          (cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' typescript/CHANGELOG.md > notes.md
          printf '\n## Install\n\n```bash\ncurl -fsSL https://raw.githubusercontent.com/%s/main/install.sh | sh -s -- <typescript|python|dotnet|java|go|rust>\n```\n' "$GITHUB_REPOSITORY" >> notes.md
          gh release create "$GITHUB_REF_NAME" out/* --title "CODA SDKs $v" --notes-file notes.md --verify-tag

      - name: Tag the Go module
        run: |
          git tag "go/${GITHUB_REF_NAME}" "$GITHUB_SHA"
          git push origin "go/${GITHUB_REF_NAME}"
          curl -fsS "https://proxy.golang.org/github.com/${GITHUB_REPOSITORY,,}/go/@v/${GITHUB_REF_NAME}.info" || true
