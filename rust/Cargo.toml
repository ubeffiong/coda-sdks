[package]
name = "coda-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Client for the CODA clinical terminology API"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ubeffiong/coda-sdks"
homepage = "https://github.com/ubeffiong/coda-sdks/tree/main/rust"
documentation = "https://docs.rs/coda-client"
keywords = ["coda", "terminology", "icd-11", "snomed", "fhir"]
categories = ["api-bindings", "science"]
authors = ["CODA contributors"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
ureq = { version = "=2.10.1", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "=0.8.5"
hmac = "=0.12.1"
sha2 = "=0.10.8"
base64 = "=0.22.1"
